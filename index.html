<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Player</title>
    <link rel="icon" type="image/png" href="./img/vinyl9.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="player-container">
        <div class="turntable">
            <div class="tonearm" id="tonearm"></div>
            <div class="record" id="record"></div>
        </div>
        <audio id="audioPlayer" src="./music/YENA_-_Catch_Catch_81041164.mp3"></audio>
        <div class="controls">
            <button id="playBtn" aria-label="Воспроизвести">
                <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>
            <button id="stopBtn" aria-label="Остановить">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M6 6h12v12H6z" />
                </svg>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
